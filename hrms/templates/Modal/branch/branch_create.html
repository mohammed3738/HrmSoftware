<div class="modal fade" id="add_branch" tabindex="-1" aria-labelledby="addBranchTitle">
  <div class="modal-dialog modal-dialog-centered">
    <form method="post" action="{% url 'create-branch' %}" class="modal-content">
      {% csrf_token %}
      <div class="modal-header">
        <h2 class="modal-title h5" id="addBranchTitle">Add Branch</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        {% for field in branch_form %}
        <div class="mb-3">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
          {{ field }}
          {% if field.errors %}<div id="{{ field.auto_id }}_error" class="text-danger small" role="alert">{{ field.errors }}</div>{% endif %}
        </div>
        {% endfor %}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Branch</button>
      </div>
    </form>
  </div>
</div>
{% if branch_form.errors %}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const dialog = document.getElementById("add_branch");
    dialog.addEventListener("shown.bs.modal", () => dialog.querySelector('[aria-invalid="true"]')?.focus(), {once: true});
    bootstrap.Modal.getOrCreateInstance(dialog).show();
  });
</script>
{% endif %}
