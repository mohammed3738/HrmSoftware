{% extends 'base2.html' %} {% block body %}
<div class="container-xxl flex-grow-1 container-p-y">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow rounded-4">
        <div class="card-header bg-primary text-white rounded-top-4">
          <h5 class="mb-0"><i class="ri-upload-2-line me-2"></i>Upload Attendance Excel</h5>
        </div>
        <div class="card-body p-4">

          <p class="text-muted mb-3">
            Upload an Excel or CSV file with the following columns:
            <strong>Emp Code</strong>, <strong>Att.Date</strong>,
            <strong>In Time</strong>, <strong>Out Time</strong>
          </p>

          <form id="attendanceUploadForm" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold">Excel/CSV File <span class="text-danger">*</span></label>
              <input type="file" class="form-control" id="attendanceFile" name="file" accept=".xlsx,.xls,.csv" required>
              <div class="form-text">Accepted formats: .xlsx, .xls, .csv</div>
            </div>

            <button type="submit" class="btn btn-primary" id="uploadBtn">
              <i class="ri-upload-2-line me-1"></i> Upload
            </button>
          </form>

          <div id="uploadProgressWrap" class="mt-4" style="display:none;">
            <div class="progress" style="height:24px;">
              <div id="uploadProgressBar" class="progress-bar progress-bar-striped progress-bar-animated"
                role="progressbar" style="width:0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
            </div>
            <div id="uploadProgressLabel" class="form-text mt-1"></div>
          </div>

          <div id="uploadResult" class="mt-4"></div>

        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById("attendanceUploadForm").addEventListener("submit", function(e) {
  e.preventDefault();
  submitAttendanceUpload();
});

function showResult(html) {
  var el = document.getElementById("uploadResult");
  if (el) el.innerHTML = html;
}

function setUploadProgress(pct, label) {
  var wrap = document.getElementById("uploadProgressWrap");
  var bar = document.getElementById("uploadProgressBar");
  var lbl = document.getElementById("uploadProgressLabel");
  wrap.style.display = "block";
  bar.style.width = pct + "%";
  bar.innerText = pct + "%";
  if (lbl) lbl.innerText = label || "";
}

function resetUploadButton() {
  var btn = document.getElementById("uploadBtn");
  btn.disabled = false;
  btn.innerHTML = '<i class="ri-upload-2-line me-1"></i> Upload';
}

function submitAttendanceUpload() {
  var fileInput = document.getElementById("attendanceFile");
  if (!fileInput.files.length) {
    showResult('<div class="alert alert-warning">Please select a file.</div>');
    return;
  }

  var btn = document.getElementById("uploadBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Processing...';
  showResult("");
  setUploadProgress(0, "Uploading file...");

  var csrfToken = document.querySelector('#attendanceUploadForm [name=csrfmiddlewaretoken]').value;
  var formData = new FormData(document.getElementById("attendanceUploadForm"));

  // Step 1: upload the file and find out how many rows it has.
  fetch("{% url 'upload_attendance_init' %}", {
    method: "POST",
    body: formData,
    headers: { "X-CSRFToken": csrfToken },
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (!data.success) {
      resetUploadButton();
      showResult('<div class="alert alert-danger"><i class="ri-error-warning-line me-1"></i><strong>Error:</strong> ' + (data.error || 'Unknown error') + '</div>');
      return;
    }
    if (data.total_rows === 0) {
      resetUploadButton();
      setUploadProgress(100, "");
      showResult('<div class="alert alert-warning">No data rows found in the file.</div>');
      return;
    }
    processNextChunk(data.upload_id, data.total_rows, csrfToken);
  })
  .catch(function(err) {
    resetUploadButton();
    showResult('<div class="alert alert-danger"><i class="ri-wifi-off-line me-1"></i> ' + err.message + '</div>');
  });
}

// Step 2: process the file in small batches so a large upload (2000+ rows)
// never has to complete inside a single request — each chunk call reports
// cumulative progress, which drives the progress bar.
function processNextChunk(uploadId, totalRows, csrfToken) {
  fetch("/upload-attendance/" + uploadId + "/chunk/", {
    method: "POST",
    headers: { "X-CSRFToken": csrfToken },
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (!data.success) {
      resetUploadButton();
      showResult('<div class="alert alert-danger"><i class="ri-error-warning-line me-1"></i><strong>Error:</strong> ' + (data.error || 'Unknown error') + '</div>');
      return;
    }

    var pct = totalRows === 0 ? 100 : Math.round((data.processed_rows / totalRows) * 100);
    setUploadProgress(pct, data.processed_rows + " / " + totalRows + " rows processed");

    if (data.done) {
      resetUploadButton();
      var html = '<div class="alert alert-success">'
        + '<i class="ri-checkbox-circle-line me-1"></i>'
        + '<strong>Upload successful!</strong><br>'
        + 'Created: <strong>' + data.created + '</strong> &nbsp;|&nbsp; '
        + 'Skipped: <strong>' + data.skipped + '</strong> &nbsp;|&nbsp; '
        + 'Total rows: <strong>' + totalRows + '</strong>'
        + '</div>';

      if (data.errors && data.errors.length) {
        html += '<div class="alert alert-warning"><strong>Row Errors (' + data.errors.length + '):</strong><ul class="mb-0 mt-2">';
        data.errors.forEach(function(err) {
          html += '<li>' + err + '</li>';
        });
        html += '</ul></div>';
      }
      showResult(html);
    } else {
      processNextChunk(uploadId, totalRows, csrfToken);
    }
  })
  .catch(function(err) {
    resetUploadButton();
    showResult('<div class="alert alert-danger"><i class="ri-wifi-off-line me-1"></i> ' + err.message + '</div>');
  });
}
</script>
{% endblock %}
