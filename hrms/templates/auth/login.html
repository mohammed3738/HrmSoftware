{% load static %}
<!DOCTYPE html>
<html lang="en" class="light-style" dir="ltr" data-theme="theme-default" data-assets-path="{% static 'assets/' %}" data-style="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <title>Login | HRMS</title>

  <link rel="icon" type="image/x-icon" href="{% static 'assets/img/favicon/favicon.ico' %}" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{% static 'assets/vendor/fonts/remixicon/remixicon.css' %}" />

  <link rel="stylesheet" href="{% static 'assets/vendor/css/rtl/core.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/vendor/css/rtl/theme-default.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/vendor/css/pages/page-auth.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/demo.css' %}" />

  <style>
    html, body { height: 100%; }
    .hrms-auth-wrapper {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }
    .hrms-auth-illustration {
      background: linear-gradient(180deg, rgba(105,108,255,.06), rgba(105,108,255,0) 60%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .hrms-auth-illustration img { max-width: 30rem; width: 100%; height: auto; }
    .hrms-auth-form-side {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .auth-form-panel { width: 100%; max-width: 26rem; }
    .password-toggle { cursor: pointer; }
  </style>
</head>

<body>
  <div class="hrms-auth-wrapper">

    <!-- Illustration side -->
    <div class="d-none d-lg-flex col-lg-7 hrms-auth-illustration">
      <img src="{% static 'assets/img/illustrations/auth-login-illustration-light.png' %}" alt="Login illustration">
    </div>

    <!-- Form side -->
    <div class="col-12 col-lg-5 authentication-bg hrms-auth-form-side p-4 p-sm-5">
      <div class="auth-form-panel mx-auto">

        <div class="app-brand mb-4 d-flex align-items-center gap-2">
          <span style="color: var(--bs-primary)">
            <svg width="34" height="18" viewBox="0 0 38 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M30.0944 2.22569C29.0511 0.444187 26.7508 -0.172113 24.9566 0.849138C23.1623 1.87039 22.5536 4.14247 23.5969 5.92397L30.5368 17.7743C31.5801 19.5558 33.8804 20.1721 35.6746 19.1509C37.4689 18.1296 38.0776 15.8575 37.0343 14.076L30.0944 2.22569Z" fill="currentColor" />
              <path d="M22.9676 2.22569C24.0109 0.444187 26.3112 -0.172113 28.1054 0.849138C29.8996 1.87039 30.5084 4.14247 29.4651 5.92397L22.5251 17.7743C21.4818 19.5558 19.1816 20.1721 17.3873 19.1509C15.5931 18.1296 14.9843 15.8575 16.0276 14.076L22.9676 2.22569Z" fill="currentColor" />
              <path d="M14.9558 2.22569C13.9125 0.444187 11.6122 -0.172113 9.818 0.849138C8.02377 1.87039 7.41502 4.14247 8.45833 5.92397L15.3983 17.7743C16.4416 19.5558 18.7418 20.1721 20.5361 19.1509C22.3303 18.1296 22.9391 15.8575 21.8958 14.076L14.9558 2.22569Z" fill="currentColor" />
              <path d="M7.82901 2.22569C8.87231 0.444187 11.1726 -0.172113 12.9668 0.849138C14.7611 1.87039 15.3698 4.14247 14.3265 5.92397L7.38656 17.7743C6.34325 19.5558 4.04298 20.1721 2.24875 19.1509C0.454514 18.1296 -0.154233 15.8575 0.88907 14.076L7.82901 2.22569Z" fill="currentColor" />
            </svg>
          </span>
          <span class="fw-semibold fs-4">HRMS</span>
        </div>

        <h4 class="mb-1">Welcome back! 👋</h4>
        <p class="text-muted mb-4">Please sign in to your account to continue</p>

        {% if messages %}
          {% for message in messages %}
          <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
            <i class="ri-error-warning-line me-2"></i>
            <div>{{ message }}</div>
          </div>
          {% endfor %}
        {% endif %}

        <form method="POST" id="loginForm">
          {% csrf_token %}

          <div class="mb-3">
            <label for="username" class="form-label">Username / Employee Code</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" autofocus required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group input-group-merge">
              <input type="password" id="password" name="password" class="form-control" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required>
              <span class="input-group-text password-toggle" id="togglePassword">
                <i class="ri-eye-off-line" id="toggleIcon"></i>
              </span>
            </div>
          </div>

          <button class="btn btn-primary d-grid w-100 mt-4" type="submit">Sign in</button>
        </form>

      </div>
    </div>
  </div>

  <script>
    const toggle = document.getElementById("togglePassword");
    const pwd = document.getElementById("password");
    const icon = document.getElementById("toggleIcon");
    if (toggle) {
      toggle.addEventListener("click", () => {
        const isHidden = pwd.type === "password";
        pwd.type = isHidden ? "text" : "password";
        icon.className = isHidden ? "ri-eye-line" : "ri-eye-off-line";
      });
    }
  </script>
</body>
</html>
