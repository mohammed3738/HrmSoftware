{% extends "auth/_auth_shell.html" %}

{% block title %}Password Updated | HRMS{% endblock %}

{% block content %}
  <div class="alert alert-success d-flex align-items-center mb-4" role="alert">
    <i class="ri-checkbox-circle-line me-2"></i>
    <div>Your password has been updated.</div>
  </div>

  <h4 class="mb-1">All set 🎉</h4>
  <p class="text-muted mb-4">Sign in with your new password to continue.</p>

  <a href="{% url 'login' %}" class="btn btn-primary d-grid w-100">Sign in</a>
{% endblock %}
