{{ form.non_field_errors }}
<div class="row g-3">
  {% for field in form %}
  <div class="{% if field.name == 'address' %}col-12{% else %}col-md-6{% endif %}">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
    {% if field.name == 'logo' and company.logo %}
    <div class="mb-2"><img src="{{ company.logo.url }}" alt="Current logo" class="atlas-company-logo"></div>
    {% endif %}
    {{ field }}
    {% if field.name == 'logo' %}<small class="text-muted d-block">JPG or PNG, up to 2 MB. Shown on salary slips.</small>{% endif %}
    {% if field.errors %}<div id="{{ field.auto_id }}_error" class="text-danger small" role="alert">{{ field.errors }}</div>{% endif %}
  </div>
  {% endfor %}
</div>
