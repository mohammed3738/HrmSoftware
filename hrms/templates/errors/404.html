<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>

    <style>
        body{
            font-family: Arial;
            background:#f8f9fa;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .error-box{
            text-align:center;
        }

        h1{
            font-size:120px;
            margin:0;
            color:#dc3545;
        }

        h3{
            margin:10px 0;
        }

        p{
            color:#6c757d;
        }

        a{
            padding:10px 20px;
            background:#0d6efd;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

        a:hover{
            background:#084298;
        }

    </style>
</head>

<body>

<div class="error-box">

<h1>404</h1>

<h3>Page Not Found</h3>

<p>The page you are looking for does not exist.</p>

<a href="/">Go Back Home</a>

</div>

</body>
</html>
