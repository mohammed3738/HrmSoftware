<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>No Company Assigned</title>

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#f4f6f9;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    text-align:center;
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
    max-width:450px;
}

.icon{
    font-size:60px;
    color:#dc3545;
    margin-bottom:20px;
}

h2{
    margin-bottom:10px;
}

p{
    color:#6c757d;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    padding:10px 20px;
    background:#0d6efd;
    color:white;
    text-decoration:none;
    border-radius:5px;
    font-size:14px;
}

.btn:hover{
    background:#084298;
}

</style>

</head>
<body>

<div class="container">

<div class="icon">⚠</div>

<h2>No Company Assigned</h2>

<p>
Your account is currently not linked to any company.<br>
Please contact your system administrator or HR department.
</p>

<a href="/" class="btn">Go to Dashboard</a>

</div>

</body>
</html>
